# Smithery MCP Server Manifest
# https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - procoreClientId
      - procoreClientSecret
    properties:
      procoreClientId:
        type: string
        description: Procore Developer OAuth / DMSA App Client ID
      procoreClientSecret:
        type: string
        description: Procore Developer OAuth / DMSA App Client Secret
      procoreBaseUrl:
        type: string
        default: "https://api.procore.com"
        description: Procore API Base URL (default is https://api.procore.com)
      procoreAllowWrites:
        type: boolean
        default: false
        description: Enable draft write operations (default false for read-only safety)
  commandFunction:
    command: uvx
    args:
      - procore-mcp
    env:
      PROCORE_CLIENT_ID: "{{procoreClientId}}"
      PROCORE_CLIENT_SECRET: "{{procoreClientSecret}}"
      PROCORE_BASE_URL: "{{procoreBaseUrl}}"
      PROCORE_ALLOW_WRITES: "{{procoreAllowWrites}}"
