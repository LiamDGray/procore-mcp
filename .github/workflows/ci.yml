name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install tiktoken pyyaml types-PyYAML

      - name: Ruff Lint and Format Verification
        run: |
          ruff check .

      - name: Mypy Strict Type Checking
        run: |
          python -m mypy --strict procore_mcp tests

      - name: Pytest Test Suite with Hypothesis
        run: |
          python -m pytest -v

      - name: Context Token Distillation Benchmark Regression Gate (>= 85.0%)
        run: |
          python -c "from procore_mcp.benchmarks import run_all_benchmarks; metrics = run_all_benchmarks(); total_raw = sum(m.raw_tokens for m in metrics); total_dist = sum(m.distilled_tokens for m in metrics); agg = (1.0 - (total_dist / total_raw)) * 100.0; print(f'Aggregate Token Reduction: {agg:.2f}%'); assert agg >= 85.0, f'Regression: Token reduction {agg:.2f}% is below 85.0% threshold'"

  whitepaper:
    name: Build Formal Whitepaper PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Whitepaper (docs/whitepaper.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: docs/whitepaper.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload Whitepaper PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: docs/whitepaper.pdf
          retention-days: 30
